# Probe-only config: append scimilarity + transcriptformer to immune_human v5.
# Extractions use --adata-path data/raw/immune_human_full.h5ad (full transcriptome).
run_name: ranking_immune_human_scim_tf_v1
seed: 0

datasets: [immune_human]

split:
  scheme: cross_donor
  test_frac: 0.2

embedders: [scimilarity, transcriptformer]

probe:
  penalty: l2
  C: null
  max_iter: 1000

irt:
  model: 1pl
  method: bayes_variational
  item_granularity: cell
  n_steps: 2000

outputs_dir: runs
cache_dir: cache/embeddings
