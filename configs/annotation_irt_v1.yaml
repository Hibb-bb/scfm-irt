# The headline run: all registered embedders x the annotation + atlas eval sets.
run_name: annotation_irt_v1
seed: 0

datasets: [zheng68k, hpancreas, immune_human, lung_atlas]

# cross_donor holds out whole donors. Harder than a stratified split, and that is the point:
# in-distribution common types sit at the ceiling and cannot separate models.
split:
  scheme: cross_donor
  test_frac: 0.2

embedders: [dev_pca, uce, scgpt, geneformer]  # + scimilarity (supp.); cell_jepa when wired

probe:
  penalty: l2
  C: null # null => select by stratified CV on the train split
  max_iter: 1000

irt:
  model: 1pl # 2PL is exploratory here; per-item discrimination is weakly identified
  method: bayes_variational
  item_granularity: cell
  item_covariates: null # a list enables the explanatory fit (requires method: numpyro)
  n_steps: 2000

outputs_dir: runs
cache_dir: cache/embeddings
