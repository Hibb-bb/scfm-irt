# Phase 2 smoke test: the entire downstream path on one toy dataset with the dependency-free
# embedder. No GPU, no checkpoints, no isolated envs. This is what CI / SLURM smoke runs.
run_name: smoke_dev
seed: 0

datasets: [smoke_toy]

split:
  scheme: stratified
  test_frac: 0.2

embedders: [dev_pca, dev_random]

probe:
  penalty: l2
  C: 1.0 # fixed, to keep the smoke run fast

irt:
  model: 1pl
  method: mle_autodiff # the reference estimator; no pyro needed
  item_granularity: cell
  n_steps: 400

outputs_dir: runs
cache_dir: cache/embeddings
