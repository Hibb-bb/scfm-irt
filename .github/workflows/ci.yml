name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # No [sc] and no [irt] on purpose: the analysis half must install and test without
      # scanpy, torch, or pyro. If this job starts needing them, the boundary has leaked.
      - run: pip install -e ".[dev]"

      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -v
