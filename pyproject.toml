[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scfm-irt"
version = "0.0.1"
description = "Item Response Theory evaluation of single-cell embedding models on cell-type annotation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dennis" }]

# The analysis half of the pipeline must stay installable without any embedder.
# See docs/IMPLEMENTATION_PLAN.md section 2.1 (the hard architectural boundary).
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Single-cell IO. Needed by scripts/ and the `data` module, not by `irt`/`analysis`.
sc = ["scanpy>=1.10", "anndata>=0.10"]
# Bayesian estimators. py-irt pulls in pyro/torch; numpyro pulls in jax.
irt = ["py-irt>=0.6", "numpyro>=0.15", "torch>=2.2"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
scfm-irt = "scfm_irt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scfm_irt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
